<style>
:root{
 --bg:#eef2fb;--card:#ffffff;--ink:#0b1736;--mute:#56658a;--line:#d6def0;
 --brand:#1a6df0;--on-brand:#ffffff;--tint:rgba(26,109,240,.09);
 --lime:#d8ff4f;--head:#1a6df0;--screen:#0b1736;--glow:rgba(26,109,240,.35);
 --err:#d42c3a;--ok:#0f8a5f;
 --display:"Unbounded","Manrope",system-ui,sans-serif;--body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif}
:root[data-theme=dark]{--bg:#070b16;--card:#0e1528;--ink:#eef2ff;--mute:#93a0bf;--line:#1f2b47;--brand:#d8ff4f;--on-brand:#070b16;--tint:rgba(216,255,79,.08);--head:#d8ff4f;--screen:#070b16;--glow:rgba(216,255,79,.28);--err:#ff6b75;--ok:#5be3a8}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#070b16;--card:#0e1528;--ink:#eef2ff;--mute:#93a0bf;--line:#1f2b47;--brand:#d8ff4f;--on-brand:#070b16;--tint:rgba(216,255,79,.08);--head:#d8ff4f;--screen:#070b16;--glow:rgba(216,255,79,.28);--err:#ff6b75;--ok:#5be3a8}}
:root[data-theme=dark] .lg-l{display:none}:root[data-theme=dark] .lg-d{display:block}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .lg-l{display:none}:root:not([data-theme=light]) .lg-d{display:block}}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);min-height:100vh;
 background-image:radial-gradient(circle at 1px 1px,var(--line) 1px,transparent 0);background-size:22px 22px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- header ---------- */
.top{max-width:1080px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700}
.lg-d{display:none}.logo img{border-radius:50%}
.tools{display:flex;gap:8px}
.icon{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 12px;cursor:pointer;font-size:14px;font-weight:600}
.icon svg{width:18px;height:18px}
.icon[aria-pressed=false] .on,.icon[aria-pressed=true] .off{display:none}

/* ---------- Vera ---------- */
.vera{display:block;overflow:visible}
.vera .halo{fill:var(--glow);transform-origin:60px 62px;opacity:0;transition:opacity .3s}
.vera .ring{fill:none;stroke:var(--head);stroke-width:1.5;stroke-dasharray:3 7;transform-origin:60px 62px;animation:spin 24s linear infinite;opacity:.6}
.vera .head{fill:var(--head)}
.vera .screen{fill:var(--screen)}
.vera .eye,.vera .mouth,.vera .bulb{fill:var(--lime)}
.vera .set{fill:none;stroke:var(--screen);stroke-width:4;stroke-linecap:round}
.vera .eyes{transition:transform .25s ease-out}
.vera .lids{transform-origin:60px 54px;animation:blink 5s infinite}
.vera .mouth{transform-origin:60px 70px;transform:scaleY(.35)}
.vera.talk .halo{opacity:1;animation:halo 1.1s ease-in-out infinite}
.vera.talk .mouth{animation:talk .16s ease-in-out infinite alternate}
.vera.talk .bulb{animation:bulb .5s ease-in-out infinite alternate}
.vera.sleep .lids{animation:none;transform:scaleY(.08)}
.vera.sleep .mouth{transform:scaleY(.2)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes talk{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
@keyframes halo{0%,100%{transform:scale(.92)}50%{transform:scale(1.06)}}
@keyframes bulb{to{opacity:.35}}
.hop{animation:hop .45s}@keyframes hop{40%{transform:translateY(-10px)}}

/* ---------- splash ---------- */
.splash{min-height:calc(100vh - 70px);display:grid;place-items:center;padding:16px 16px 48px;text-align:center}
.splash .vera{width:min(250px,62vw);margin:0 auto 8px;cursor:pointer}
.splash h1{font:700 clamp(40px,9vw,76px)/1 var(--display);letter-spacing:-.02em;margin:0 0 14px}
.splash p{color:var(--mute);max-width:30em;margin:0 auto 26px;font-size:18px}
.splash .btns{display:flex;flex-direction:column;gap:10px;max-width:340px;margin:0 auto}
.splash .wake{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.splash .wake2{animation:rise .9s .15s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}

/* ---------- app layout ---------- */
.app{max-width:1080px;margin:0 auto;padding:0 16px 40px;display:grid;gap:16px}
.guide{display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:end}
.guide .vera{width:76px;cursor:pointer}
.bubble{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px 20px 20px 6px;padding:12px 14px;min-height:64px}
.bubble .who{font:700 13px var(--display);color:var(--brand);display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.bubble .say{margin:0;font-size:15.5px;display:grid}.bubble .say>span{grid-area:1/1}.bubble .say .full{visibility:hidden}
.replay{background:none;border:0;padding:4px;cursor:pointer;color:var(--mute);display:inline-flex}
.replay svg{width:18px;height:18px}

.rail{list-style:none;margin:0;padding:0;display:flex;align-items:flex-start;position:relative}
.rail li{flex:1;position:relative;text-align:center}
.rail li:not(:last-child)::after{content:"";position:absolute;top:15px;left:calc(50% + 17px);right:calc(-50% + 17px);height:2px;background:var(--line)}
.rail li.done:not(:last-child)::after{background:var(--brand)}
.rail button{background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;width:100%}
.dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--display);border:2px solid var(--line);background:var(--card);color:var(--mute)}
.done .dot{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.now .dot{border-color:var(--brand);color:var(--brand);box-shadow:0 0 0 5px var(--tint)}
.rail .nm{font-size:12px;font-weight:600;color:var(--mute);line-height:1.2}
.now .nm{color:var(--ink)}
.railnote{font-size:13.5px;color:var(--mute);margin:6px 0 0;min-height:1.4em;text-align:center}

.card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:22px 20px}
.card h1{font:700 clamp(22px,4.6vw,30px)/1.15 var(--display);letter-spacing:-.01em;margin:0 0 8px}
.card .lead{color:var(--mute);margin:0 0 18px;max-width:36em}
.enter{animation:enter .35s ease-out}
@keyframes enter{from{opacity:0;transform:translateX(14px)}}
.foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:20px}
.help{font-size:14px;text-align:center;color:var(--mute)}

/* ---------- desktop ---------- */
@media(min-width:900px){
 .app{grid-template-columns:340px 1fr;align-items:start;gap:28px;padding-top:8px}
 .side{position:sticky;top:20px;display:grid;gap:20px}
 .guide{grid-template-columns:1fr;justify-items:center;gap:6px}
 .guide .vera{width:190px}
 .bubble{border-radius:20px;width:100%}
 .bubble::before{content:"";position:absolute;top:-8px;left:50%;width:14px;height:14px;background:var(--card);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:translateX(-50%) rotate(45deg)}
 .rail{flex-direction:column;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
 .rail li{text-align:left}
 .rail li:not(:last-child)::after{top:34px;left:15px;right:auto;width:2px;height:14px}
 .rail button{flex-direction:row;gap:12px}
 .rail .nm{font-size:14.5px}
 .railnote{display:none}
 .card{padding:34px 36px}
}

/* ---------- form parts ---------- */
label.f{display:block;font-weight:600;margin:16px 0 6px}
.hint{font-size:13.5px;color:var(--mute);margin:6px 0 0}
input[type=text],input[type=email],input[type=tel],select,textarea{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-size:16px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px var(--tint)}
textarea{min-height:84px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 22px;border:0;border-radius:14px;background:var(--brand);color:var(--on-brand);font-weight:700;font-size:16px;cursor:pointer;text-decoration:none;min-width:150px}
.btn:disabled{opacity:.55;cursor:wait}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.wide{width:100%}
.link{background:none;border:0;color:var(--mute);cursor:pointer;font-weight:600;padding:8px 4px;text-decoration:underline;text-underline-offset:3px}
.err{color:var(--err);font-weight:600;font-size:14.5px;min-height:1.4em;margin:12px 0 0}

/* choice tiles (radio + checkbox) */
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opts.grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.opts.five{grid-template-columns:repeat(5,1fr);gap:6px}
.opt{position:relative;display:flex;align-items:center;gap:12px;padding:14px;border:1.5px solid var(--line);border-radius:16px;cursor:pointer;background:var(--bg);font-weight:600;transition:border-color .15s,background .15s}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt:has(input:checked){border-color:var(--brand);background:var(--tint)}
.opt:has(input:focus-visible){outline:2px solid var(--brand);outline-offset:2px}
.box{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;background:var(--card)}
.opt input[type=radio]+.box{border-radius:50%}
.box svg{width:14px;height:14px;opacity:0;color:var(--on-brand)}
.opt:has(input:checked) .box{background:var(--brand);border-color:var(--brand)}
.opt:has(input:checked) .box svg{opacity:1}
.five .opt{flex-direction:column;gap:2px;padding:12px 4px;font:700 18px var(--display);justify-content:center}
.scale{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mute);margin-top:6px}
.opt.locked{opacity:.45;cursor:not-allowed}
.big .opt{padding:18px 16px;font-size:17px}

/* journey list on welcome screen */
.journey{list-style:none;margin:0 0 18px;padding:0;display:grid;gap:2px}
.journey li{display:grid;grid-template-columns:40px 1fr;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.journey li:last-child{border-bottom:0}
.journey .dot{width:36px;height:36px}
.journey b{display:block}
.journey span{color:var(--mute);font-size:14.5px}
.ready{background:var(--tint);border-radius:16px;padding:14px 16px;font-size:14.5px;margin-bottom:6px}
.ready b{display:block;margin-bottom:4px}
.ready ul{margin:0;padding-left:18px}

/* socials */
.soc{display:flex;align-items:center;gap:12px;padding:14px;border:1.5px solid var(--line);border-radius:16px;margin-bottom:10px;text-decoration:none;color:var(--ink);font-weight:600;background:var(--bg)}
.soc .dot{width:30px;height:30px;flex:none}
.soc .tag{margin-left:auto;font-size:13px;font-weight:600;color:var(--mute)}
.soc.next{border-color:var(--brand)}
.soc.next .dot{border-color:var(--brand);color:var(--brand);animation:pulse 1.6s ease-in-out infinite}
.soc.next .tag{color:var(--brand)}
.soc.done .dot{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.soc.lock{opacity:.45;pointer-events:none}
@keyframes pulse{50%{box-shadow:0 0 0 6px var(--tint)}}

.namecard{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:14px 16px;border-radius:16px;background:var(--screen);color:#eef2ff;font-weight:700;font-size:17px;flex-wrap:wrap}
.namecard code{font:inherit;overflow-wrap:anywhere}
.howto{margin-top:16px;border:1.5px solid var(--line);border-radius:18px;padding:14px 16px}
.howto h2{font:700 16px var(--display);margin:0 0 10px}
.tabs{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px;margin-bottom:10px}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:999px;font-weight:700;cursor:pointer;color:var(--mute)}
.tabs button[aria-selected=true]{background:var(--brand);color:var(--on-brand)}
.howto ol{margin:0;padding-left:20px;display:grid;gap:6px;font-size:15px}
[hidden]{display:none!important}
.howto .tip{font-size:14px;color:var(--mute);margin:10px 0 0}
.namecard button{background:var(--lime);color:#0b1736;border:0;border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer}

.note{margin:14px 0 0;padding:14px 16px;border-radius:16px;background:var(--tint);font-size:15px}
.next-stage{margin-top:18px;border:1.5px solid var(--brand);border-radius:20px;padding:18px}
.next-stage h2{font:700 19px/1.25 var(--display);margin:0 0 10px}
.next-stage ol{margin:0 0 14px;padding-left:20px;display:grid;gap:8px}

/* toast + confetti */
.toast{position:fixed;left:50%;top:14px;transform:translate(-50%,calc(-100% - 30px));visibility:hidden;background:var(--screen);color:#eef2ff;padding:11px 18px;border-radius:999px;font-weight:700;z-index:20;transition:transform .35s cubic-bezier(.2,.8,.2,1);box-shadow:0 10px 30px rgba(0,0,0,.2);white-space:nowrap}
.toast.show{transform:translate(-50%,0);visibility:visible}
.toast i{font-style:normal;color:var(--lime)}
.cf{position:fixed;top:-14px;width:8px;height:12px;border-radius:2px;z-index:15;animation:fall 2.6s ease-in forwards;pointer-events:none}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(540deg)}}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

const API_URL=((window.RWA_CONFIG||{}).apiUrl||'').trim();

/* Talks to the Apps Script backend. Interns only ever see this website. */
function api(action,payload){
 if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(API_URL))return Promise.reject(new Error('API_URL is not set'));
 return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action:action},payload||{}))})
  .then(r=>r.json()).then(d=>{if(!d||d.error)throw new Error(d&&d.error||'Server error');return d.result})}
function run(){let ok=()=>{},fail=()=>{};const r={withSuccessHandler(f){ok=f;return r},withFailureHandler(f){fail=f;return r},
 getStartData(){api('getStartData').then(ok,fail)},saveStep(e,f){api('saveStep',{email:e,fields:f}).then(ok,fail)}};return r}

function talking(on){document.querySelectorAll('.vera').forEach(v=>v.classList.toggle('talk',on))}
function hop(){if(RM())return;document.querySelectorAll('.vera').forEach(v=>{v.classList.remove('hop');void v.getBoundingClientRect();v.classList.add('hop')})}
// eyes follow the pointer
let eyeRaf;
addEventListener('pointermove',e=>{cancelAnimationFrame(eyeRaf);eyeRaf=requestAnimationFrame(()=>{document.querySelectorAll('.vera').forEach(v=>{const r=v.getBoundingClientRect();if(!r.width)return;const dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height*.45),d=Math.hypot(dx,dy)||1,m=Math.min(4,d/40);const g=v.querySelector('.eyes');if(g)g.style.transform=`translate(${(dx/d*m).toFixed(1)}px,${(dy/d*m*.7).toFixed(1)}px)`})})});

/* ============ Vera: voice ============ */
const V={ok:'speechSynthesis' in window,on:true,voice:null,last:''};
function pickVoice(){if(!V.ok)return;const vs=speechSynthesis.getVoices();if(!vs.length)return;
 const pref=[/Google UK English Female/i,/Microsoft (Sonia|Libby|Aria|Jenny|Ava|Emma).*(Online|Natural)/i,/Samantha/i,/Serena|Karen|Moira|Tessa|Martha/i,/Microsoft (Zira|Hazel|Susan)/i,/Google US English/i];
 for(const p of pref){const v=vs.find(v=>p.test(v.name));if(v){V.voice=v;return}}
 V.voice=vs.find(v=>/^en[-_](GB|NG|ZA|KE|GH)/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}
if(V.ok){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function spoken(t){return t.replace(/RWA Inc\.?/g,'R W A Inc').replace(/\bAI\b/g,'A.I.').replace(/\bUX\/UI\b/g,'U X, U I').replace(/\bQA\b/g,'Q A')}
function speak(t){
 V.last=t;if(!V.ok)return;speechSynthesis.cancel();talking(false);if(!V.on)return;
 const parts=spoken(t).match(/[^.!?]+[.!?]*/g)||[t];
 setTimeout(()=>{parts.forEach((p,k)=>{const u=new SpeechSynthesisUtterance(p.trim());if(V.voice){u.voice=V.voice;u.lang=V.voice.lang}else u.lang='en-GB';u.rate=.96;u.pitch=1.06;
  u.onstart=()=>talking(true);if(k===parts.length-1)u.onend=u.onerror=()=>talking(false);speechSynthesis.speak(u)})},80)}
function toggleSound(){V.on=!V.on;store.set(KEY+'-snd',V.on);syncSound();if(!V.on&&V.ok){speechSynthesis.cancel();talking(false)}else if(started)speak(V.last)}
function syncSound(){const b=$('snd');b.setAttribute('aria-pressed',V.on);$('sndt').textContent=V.on?'Voice on':'Voice off';if(!V.ok)b.style.display='none'}
function poke(){hop();if(started&&V.last)speak(V.last)}

function say(t){
 const el=$('say');if(!el){speak(t);return}
 clearInterval(typer);speak(t);if($('sayfull'))$('sayfull').textContent=t;
 if(RM()){el.textContent=t;return}
 let k=0;el.textContent='';typer=setInterval(()=>{el.textContent=t.slice(0,++k);if(k>=t.length)clearInterval(typer)},22)}

function draw(){
 const st=steps[i];rail();
 $('card').innerHTML=`<div class="enter">${st.html()}${st.end?'':`<p class="err" id="err" role="alert"></p><div class="foot">${i>0&&i<11?`<button class="link" type="button" onclick="back()">Back</button>`:'<span></span>'}<button class="btn" id="nx" type="button" onclick="next()">${st.btn||'Continue'}</button></div>`}</div>`;
 if(st.stage!==lastStage&&st.stage<5){toast(`Step ${st.stage+1} unlocked: <i>${STAGES[st.stage].nm}</i>`);confetti(24)}
 lastStage=st.stage;say(st.line());if(st.after)st.after();persist();
 const f=$('card').querySelector('input[type=text],input[type=email],input[type=tel]');if(f&&innerWidth>900)f.focus({preventScroll:true});
 scrollTo({top:0,behavior:RM()?'auto':'smooth'})}
function back(){if(busy||i===0)return;i--;lastStage=steps[i].stage;draw()}
function next(){
 if(busy)return;err('');const r=steps[i].go();
 if(typeof r==='string'){err(r);return}
 if(i<2||!S.email){i++;hop();draw();return} // nothing to save yet
 busy=true;const b=$('nx'),t=b.textContent;b.disabled=true;b.textContent='Saving…';
 run().withSuccessHandler(res=>{if(res&&res.joined)S.joined=res.joined;busy=false;i++;hop();draw()})
  .withFailureHandler(()=>{busy=false;b.disabled=false;b.textContent=t;err("That didn't save. Check your internet connection and tap the button again.")})
  .saveStep(S.email,r)}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&started&&e.target.matches('input[type=text],input[type=email],input[type=tel]')){e.preventDefault();next()}});

/* ============ start ============ */
(function init(){
 const th=store.get(KEY+'-thm');if(th)document.documentElement.dataset.theme=th;
 const sn=store.get(KEY+'-snd');if(sn===false)V.on=false;
 syncSound();
 run().withSuccessHandler(d=>{D=d;$('co').textContent=d.config.company;splash()})
  .withFailureHandler(e=>{const setup=/API_URL/.test(e&&e.message);$('root').innerHTML=`<section class="splash"><div><h1 style="font-size:28px">${setup?'Almost ready':'We could not load the page'}</h1><p>${setup?'Paste your Apps Script web app link into config.js.':'Check your internet connection, then refresh the page.'}</p></div></section>`})
  .getStartData()})();
</script></body></html>
